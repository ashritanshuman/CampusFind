version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campusfind_db
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campuspassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_USER: campususer
      DB_PASSWORD: campuspassword
      DB_NAME: campusfind_db
      DB_PORT: 3306
      JWT_SECRET: campusfind_super_secure_jwt_secret_key_change_in_production_2026
      CORS_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
